[package]
name = "ligase"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "native, modular development environment"
repository = "https://github.com/SkuldNorniern/ligase"

[dependencies]
aurea = { git = "https://github.com/SkuldNorniern/aurea", rev = "988e3de4f59c29f9b67477a1a416281fbe6c771e" }
resolvase = { git = "https://github.com/SkuldNorniern/resolvase", rev = "60b9fb8959715471d84741ae81b0127f9580a1e2" }
vanta = { git = "https://github.com/SkuldNorniern/vanta", rev = "40fe8683dab31a70327ac73b2b53a166a841877f" }
toml = "1"
serde_json = "1"
# the built-in agent's https calls to openai-compatible servers
ureq = { version = "2", default-features = false, features = ["json"] }
sylven = { git = "https://github.com/SkuldNorniern/sylven", rev = "f51e7b42ecec2072545c9f300d28f682073dad32" }
sylven-runtime = { git = "https://github.com/SkuldNorniern/sylven", rev = "f51e7b42ecec2072545c9f300d28f682073dad32" }
sylven-dsl = { git = "https://github.com/SkuldNorniern/sylven", rev = "f51e7b42ecec2072545c9f300d28f682073dad32" }
hayro = "0.9.0"

# https: the system's own tls on windows and macos, so no c compiler or
# assembler is needed there; rustls elsewhere
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[build-dependencies]
winres = "0.1"
